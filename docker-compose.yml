services:
  mysql:
    image: mysql:8.4
    container_name: kanoa-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kanoa
      MYSQL_USER: kanoa
      MYSQL_PASSWORD: kanoa

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: kanoa-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:
